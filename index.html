<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/hlc-logo-transparent.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/hlc-logo-transparent.png" />
    <link rel="stylesheet" href="/public-home-app-reconciliation-20260907.css" />
    <link id="hlc-runtime-physical-authority" rel="stylesheet" href="/runtime-physical-authority-20260907.css" />
    <link id="hlc-runtime-portal-authority" rel="stylesheet" href="/runtime-portal-authority-20260907.css" />
    <link id="hlc-physical-component-root-authority" rel="stylesheet" href="/physical-component-root-authority-20260907.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b5ed7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HomeLead Connect" />
    <script>
      (() => {
        const shortSide = Math.min(window.screen?.width || 9999, window.screen?.height || 9999);
        if (shortSide <= 760) {
          document.documentElement.classList.add('hlc-compact-device');
          const viewport = document.querySelector('meta[name="viewport"]');
          if (viewport) viewport.setAttribute('content', `width=${shortSide}, initial-scale=1.0, viewport-fit=cover`);
        }
      })();
    </script>
    <title>HomeLead Connect</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const appHost = 'app.homeleadconnect.org';
        const publicHome = window.location.pathname === '/' && window.location.hostname.toLowerCase() !== appHost;
        if (!publicHome) return;
        const root = document.getElementById('root');
        if (!root) return;
        root.dataset.hlcPublicHomeSeeded = 'true';
        root.innerHTML = `
          <main class="hlc-home" data-hlc-public-home-main>
            <header class="hlc-frontdoor-header">
              <a href="/" aria-label="HomeLead Connect home">
                <img src="/hlc-logo-transparent.png" alt="HomeLead Connect LLC" loading="eager" decoding="async" fetchpriority="low" width="40" height="40" />
              </a>
              <a data-route-to="/request-service" href="https://app.homeleadconnect.org/request-service">Request Service</a>
            </header>
            <section class="hlc-home-hero hlc-frontdoor-hero">
              <div class="hlc-frontdoor-photo" aria-hidden="true"></div>
              <div class="hlc-frontdoor-overlay" aria-hidden="true"></div>
              <div class="hlc-frontdoor-content">
                <p class="hlc-home-hero-kicker">HOME SERVICES. CONNECTED BETTER</p>
                <h1 class="hlc-home-hero-title">Home help should feel easier.</h1>
                <p class="hlc-home-hero-copy">Tell us what your home needs. HomeLead Connect helps renters, homeowners, and everyday households move toward the right professional and a clearer next step.</p>
                <div class="hlc-home-hero-actions">
                  <a data-route-to="/request-service" href="https://app.homeleadconnect.org/request-service">Request Home Service</a>
                  <a href="https://professionals.homeleadconnect.org/">For Professionals</a>
                </div>
              </div>
            </section>
          </main>`;
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
