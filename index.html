<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/hlc-logo-transparent.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/hlc-logo-transparent.png" />
    <link rel="stylesheet" href="/public-home-app-reconciliation-20260907.css" />
    <link id="hlc-runtime-physical-authority" rel="stylesheet" href="/runtime-physical-authority-20260907.css" />
    <link id="hlc-runtime-portal-authority" rel="stylesheet" href="/runtime-portal-authority-20260907.css" />
    <link id="hlc-physical-component-root-authority" rel="stylesheet" href="/physical-component-root-authority-20260907.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b4fa8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HomeLead Connect" />
    <script>
      (() => {
        const shortSide = Math.min(window.screen?.width || 9999, window.screen?.height || 9999);
        if (shortSide <= 760) {
          document.documentElement.classList.add('hlc-compact-device');
          const viewport = document.querySelector('meta[name="viewport"]');
          if (viewport) viewport.setAttribute('content', `width=${shortSide}, initial-scale=1.0, viewport-fit=cover`);
        }
      })();
    </script>
    <title>HomeLead Connect</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const appHost = 'app.homeleadconnect.org';
        const publicHome = window.location.pathname === '/' && window.location.hostname.toLowerCase() !== appHost;
        if (!publicHome) return;
        const root = document.getElementById('root');
        if (!root) return;
        root.innerHTML = `
          <main class="hlc-home hlc-frontdoor-site">
            <nav class="hlc-frontdoor-nav"><div class="hlc-frontdoor-wrap hlc-frontdoor-navin"><a class="hlc-frontdoor-brand" href="/" aria-label="HomeLead Connect home"><img src="/hlc-logo-transparent.png" alt="HomeLead Connect" width="58" height="58" /></a><div class="hlc-frontdoor-navlinks"><a class="hlc-frontdoor-primary" href="https://app.homeleadconnect.org/request-service">Request Service</a></div></div></nav>
            <section class="hlc-frontdoor-hero"><img src="/hlc-frontdoor-resident-hero.webp" alt="Resident working on a home project" width="1400" height="900" fetchpriority="high" /><div class="hlc-frontdoor-hero-content"><p class="hlc-frontdoor-kicker">Home services, connected better</p><h1>Home help should feel easier.</h1><p>Tell us what your home needs. HomeLead Connect helps renters, homeowners, and everyday households move toward the right professional and a clearer next step.</p><div class="hlc-frontdoor-actions"><a class="hlc-frontdoor-btn hlc-frontdoor-btn-primary" href="https://app.homeleadconnect.org/request-service">Request Home Service</a><a class="hlc-frontdoor-btn hlc-frontdoor-btn-secondary" href="https://professionals.homeleadconnect.org/">For Professionals</a></div></div></section>
          </main>`;
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
