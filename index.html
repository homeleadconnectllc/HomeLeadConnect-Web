<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/hlc-logo-transparent.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/hlc-logo-transparent.png" />
    <script>
      (() => {
        const isStandalonePublicHome = window.location.pathname === "/" && window.location.hostname.toLowerCase() !== "app.homeleadconnect.org";
        if (isStandalonePublicHome) return;
        document.write('<link id="hlc-frontdoor-accessibility-authority" rel="stylesheet" href="/frontdoor-accessibility-authority-20260907.css" /><link id="hlc-runtime-structural-safeguards" rel="stylesheet" href="/runtime-structural-safeguards-20260919.css" />');
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#03111f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HomeLead Connect" />
    <script>
      (() => {
        const shortSide = Math.min(window.screen?.width || 9999, window.screen?.height || 9999);
        if (shortSide <= 760) {
          document.documentElement.classList.add('hlc-compact-device');
          const viewport = document.querySelector('meta[name="viewport"]');
          if (viewport) viewport.setAttribute('content', `width=${shortSide}, initial-scale=1.0, viewport-fit=cover`);
        }
      })();
    </script>
    <title>HomeLead Connect</title>
  </head>
  <body>
    <div id="root"></div>
    <link rel="preload" as="image" href="/home-hero-authority-desktop-20260916.webp" media="(min-width: 681px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/home-hero-authority-mobile-20260916.webp" media="(max-width: 680px)" fetchpriority="high" />
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
