name: HLC Rendered Quality Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://agfwqnirspmptjiqrrtk.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_oe-fZIb14XWNWgk5-0pPfw_Xqb0dqYv
      VITE_AUTH_CAPTCHA_REQUIRED: "false"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify launch candidate
        run: npm run verify:launch

      - name: Start rendered preview
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/hlc-preview.log 2>&1 &
          echo $! > /tmp/hlc-preview.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /tmp/hlc-preview.html; then
              grep -qi 'HomeLead Connect' /tmp/hlc-preview.html
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hlc-preview.log || true
          exit 30

      - name: Calendar route delivery smoke
        run: |
          set -euo pipefail
          code="$(curl -sS -L -o /tmp/hlc-calendar.html -w '%{http_code}' http://127.0.0.1:4173/calendar)"
          echo "Calendar route HTTP $code"
          test "$code" = "200"
          grep -qi 'HomeLead Connect' /tmp/hlc-calendar.html
          echo 'Calendar SPA route delivery: PASS'

      - name: Mobile rendered measurement
        run: |
          set -euo pipefail
          npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/ \
            --quiet \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,best-practices \
            --output=json \
            --output-path=/tmp/lighthouse-mobile.json
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/lighthouse-mobile.json', 'utf8'));
          const score = (key) => Number(report.categories[key]?.score ?? 0);
          console.log('Mobile Lighthouse', {
            performance: score('performance'),
            accessibility: score('accessibility'),
            bestPractices: score('best-practices'),
          });
          NODE

      - name: Desktop rendered measurement
        run: |
          set -euo pipefail
          npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/ \
            --quiet \
            --preset=desktop \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,best-practices \
            --output=json \
            --output-path=/tmp/lighthouse-desktop.json
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/lighthouse-desktop.json', 'utf8'));
          const score = (key) => Number(report.categories[key]?.score ?? 0);
          console.log('Desktop Lighthouse', {
            performance: score('performance'),
            accessibility: score('accessibility'),
            bestPractices: score('best-practices'),
          });
          NODE

      - name: Evaluate rendered thresholds
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const load = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const scores = (report) => ({
            performance: Number(report.categories.performance?.score ?? 0),
            accessibility: Number(report.categories.accessibility?.score ?? 0),
            bestPractices: Number(report.categories['best-practices']?.score ?? 0),
          });
          const mobile = scores(load('/tmp/lighthouse-mobile.json'));
          const desktop = scores(load('/tmp/lighthouse-desktop.json'));
          console.log('Rendered quality summary', { mobile, desktop });

          const failures = [];
          if (mobile.performance < 0.85) failures.push(`Mobile performance ${mobile.performance} < 0.85`);
          if (mobile.accessibility < 0.95) failures.push(`Mobile accessibility ${mobile.accessibility} < 0.95`);
          if (mobile.bestPractices < 0.95) failures.push(`Mobile best practices ${mobile.bestPractices} < 0.95`);
          if (desktop.performance < 0.95) failures.push(`Desktop performance ${desktop.performance} < 0.95`);
          if (desktop.accessibility < 0.95) failures.push(`Desktop accessibility ${desktop.accessibility} < 0.95`);
          if (desktop.bestPractices < 0.95) failures.push(`Desktop best practices ${desktop.bestPractices} < 0.95`);

          if (failures.length) {
            console.error('Rendered quality gate failed:\n- ' + failures.join('\n- '));
            process.exit(1);
          }
          console.log('Rendered quality gate: PASS');
          NODE

      - name: Upload rendered QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-quality-${{ github.sha }}
          path: |
            /tmp/lighthouse-mobile.json
            /tmp/lighthouse-desktop.json
            /tmp/hlc-preview.log
            /tmp/hlc-calendar.html
          if-no-files-found: warn
          retention-days: 14
