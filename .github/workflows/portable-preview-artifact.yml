name: HLC Portable Preview Artifact

on:
  push:
    branches:
      - netlify/launch-preview-refresh
  workflow_dispatch:

jobs:
  build-portable-preview:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://agfwqnirspmptjiqrrtk.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_oe-fZIb14XWNWgk5-0pPfw_Xqb0dqYv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build -- --base=./
      - uses: actions/upload-artifact@v4
        with:
          name: hlc-portable-preview-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
