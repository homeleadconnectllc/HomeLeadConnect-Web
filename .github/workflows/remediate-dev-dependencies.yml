name: HLC One-Time Dev Dependency Remediation

on:
  push:
    branches:
      - v2/cinematic-community-homepage-20260911

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.head_commit.message != 'chore: remediate dev dependency vulnerabilities'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Update vulnerable development dependencies
        run: npm install --package-lock-only --ignore-scripts --save-dev browserslist@4.28.7 baseline-browser-mapping@2.11.0
      - name: Commit dependency remediation and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/remediate-dev-dependencies.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: remediate dev dependency vulnerabilities"
          git push origin HEAD:v2/cinematic-community-homepage-20260911
