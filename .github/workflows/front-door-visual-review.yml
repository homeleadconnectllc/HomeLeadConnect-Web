name: The HomeLead_Connect Experience — Front Door Visual Review

on:
  push:
    branches:
      - 'visual/front-door-system-pass-20260910'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://cguhtshclyybivvdnpig.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_MQioEyUGv8MNlowJgVyXYQ_kf5cyafA
      VITE_AUTH_CAPTCHA_REQUIRED: "false"
      HLC_VISUAL_BASE_URL: http://127.0.0.1:4173
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Assert exact candidate checkout
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          echo "Exact candidate: $actual"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build candidate
        run: npm run build

      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.55.0

      - name: Install Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Ensure Chromium runtime dependencies
        run: |
          set -euo pipefail
          if ! node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            await browser.close();
          })().catch(() => process.exit(1));
          NODE
          then
            npx playwright install-deps chromium
            node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          fi

      - name: Start rendered preview
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/hlc-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hlc-preview.log || true
          exit 30

      - name: Certify exact-candidate navigation interactions
        run: node scripts/public-navigation-certification.mjs

      - name: Capture front door visual evidence
        run: node scripts/front-door-visual-capture.mjs

      - name: Upload visual review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: front-door-visual-review-${{ env.CANDIDATE_SHA }}
          path: |
            /tmp/candidate-sha.txt
            /tmp/home-mobile.png
            /tmp/home-desktop.png
            /tmp/home-footer-mobile.png
            /tmp/home-footer-desktop.png
            /tmp/login-mobile.png
            /tmp/login-desktop.png
            /tmp/about-*.png
            /tmp/register-*.png
            /tmp/forgot-password-*.png
            /tmp/reset-password-*.png
            artifacts/public-navigation-certification
          if-no-files-found: error
          retention-days: 14
