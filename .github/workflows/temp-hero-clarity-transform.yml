name: Temp Hero Clarity Transform

on:
  push:
    branches:
      - fix/homepage-hero-clarity-transform-20260916-temp

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enhance existing hero asset deterministically
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageEnhance, ImageFilter
          path = 'public/hlc-homepage-hero-people-first.webp'
          img = Image.open(path).convert('RGB')
          up = img.resize((img.width * 2, img.height * 2), Image.Resampling.LANCZOS)
          up = ImageEnhance.Contrast(up).enhance(1.035)
          up = ImageEnhance.Sharpness(up).enhance(1.12)
          up = up.filter(ImageFilter.UnsharpMask(radius=1.15, percent=88, threshold=3))
          up.save(path, 'WEBP', quality=94, method=6)
          print(f'{img.width}x{img.height} -> {up.width}x{up.height}')
          PY
      - name: Commit enhanced asset and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-hero-clarity-transform.yml
          git add public/hlc-homepage-hero-people-first.webp
          git commit -m 'Homepage: enhance existing hero image clarity [skip ci]'
          git push origin HEAD:fix/homepage-hero-clarity-transform-20260916-temp
