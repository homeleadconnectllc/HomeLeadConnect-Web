name: HLC Launch Candidate

on:
  push:
    branches:
      - sprint/ecosystem-integration
      - sprint/ecosystem-launch-completion
      - launch/full-hlc-hardening-2026-08-14
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit development dependencies (informational)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Verify launch candidate
        shell: bash
        run: |
          set -o pipefail
          npm run verify:launch 2>&1 | tee verify.log

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: verify-log
          path: verify.log
