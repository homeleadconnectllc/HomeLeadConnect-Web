# Mobile A+ exact-head certification uses the same launch gate and thresholds as production candidates.
name: HLC Launch Candidate

on:
  push:
    branches:
      - sprint/ecosystem-integration
      - sprint/ecosystem-launch-completion
      - launch/full-hlc-hardening-2026-08-14
      - launch/global-readiness-2026-08-16
      - 'postlaunch/mobile-a-plus-*'
  pull_request:
    branches:
      - main
      - postlaunch/mobile-a-plus-20260826

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Remediate development dependency vulnerabilities once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'v2/cinematic-community-homepage-20260911' && github.event.pull_request.head.sha == github.sha && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'v2/cinematic-community-homepage-20260911'
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%s | grep -Fq 'chore: remediate dev dependency vulnerabilities'; then
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --save-dev browserslist@4.28.7 baseline-browser-mapping@2.11.1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if [ -f .github/workflows/remediate-dev-dependencies.yml ]; then
            git rm .github/workflows/remediate-dev-dependencies.yml
          fi
          git diff --cached --quiet && exit 0
          git commit -m "chore: remediate dev dependency vulnerabilities"
          git push origin HEAD:v2/cinematic-community-homepage-20260911
          exit 0

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Audit production dependencies
        shell: bash
        env:
          npm_config_fetch_timeout: 60000
          npm_config_fetch_retries: 0
        run: |
          set -uo pipefail

          max_attempts=3
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Production audit attempt $attempt/$max_attempts"
            set +e
            audit_output=$(timeout 70s npm audit --omit=dev --audit-level=high 2>&1)
            audit_status=$?
            set -e
            printf '%s\n' "$audit_output"

            if [ "$audit_status" -eq 0 ]; then
              exit 0
            fi

            if [ "$audit_status" -eq 124 ]; then
              infra_failure=true
            elif printf '%s\n' "$audit_output" | grep -Eqi 'network timeout|audit endpoint returned an error|503 Service Unavailable|EAI_AGAIN|ECONNRESET|ETIMEDOUT|ENETUNREACH|socket hang up'; then
              infra_failure=true
            else
              infra_failure=false
            fi

            if [ "$infra_failure" != true ]; then
              echo "Production audit returned a non-network failure; preserving the security gate failure."
              exit "$audit_status"
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Production audit could not reach npm after $max_attempts bounded attempts."
              exit "$audit_status"
            fi

            sleep $((attempt * 5))
            attempt=$((attempt + 1))
          done

      - name: Audit development dependencies (informational)
        continue-on-error: true
        shell: bash
        env:
          npm_config_fetch_timeout: 45000
          npm_config_fetch_retries: 0
        run: timeout 55s npm audit --audit-level=high

      - name: Verify launch candidate
        shell: bash
        run: |
          set -o pipefail
          npm run verify:launch 2>&1 | tee verify.log

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: verify-log
          path: verify.log
