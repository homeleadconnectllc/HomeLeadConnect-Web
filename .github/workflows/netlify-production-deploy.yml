name: HLC Direct Netlify Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify Netlify token can access HLC site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo 'NETLIFY_AUTH_TOKEN is not configured'; exit 10; }
          NETLIFY_SITE_ID="641b807e-cb0e-4132-9075-a057481bee32"
          curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" https://api.netlify.com/api/v1/sites > /tmp/netlify-sites.json
          jq -e --arg id "$NETLIFY_SITE_ID" 'any(.[]; .id == $id)' /tmp/netlify-sites.json >/dev/null || {
            echo 'NETLIFY_AUTH_TOKEN is valid but cannot access the configured HLC Netlify site.'
            exit 12
          }
      - name: Link HLC site in CI
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx --yes netlify-cli@latest link --id 641b807e-cb0e-4132-9075-a057481bee32 --auth "$NETLIFY_AUTH_TOKEN"
      - name: Deploy current main to Netlify production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 641b807e-cb0e-4132-9075-a057481bee32
        run: |
          npx --yes netlify-cli@latest deploy --prod --dir=dist --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --message "HLC production $GITHUB_SHA"
