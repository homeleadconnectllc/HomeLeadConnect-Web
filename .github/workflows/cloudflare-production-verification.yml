name: HLC Production Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-source:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Verify exact Four Pathways source assets
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/four-pathways.sha256 <<'EOF'
          b561b5f1ec9205f98f6d64823a18ffc8336f9720da54c1d9f9aa37a2515d4af0  public/four-pathways-residents-hq-20260915.jpg
          3b64008bf190d0aa9709602a1fed4168d6d9d5eca0edcbe4f5fddc6a9c7ef58f  public/four-pathways-professionals-hq-20260915.jpg
          b2d36b2f1ba59690093a9b07db9996ad0062f83dde4c97eede1e5c7bd9bbc958  public/four-pathways-partners-hq-20260915.jpg
          b0f867f47795b1cd1f94b0923befc8fb98aef8bca418a6e6c4152347d8550091  public/four-pathways-community-hq-20260915.jpg
          EOF
          sha256sum -c /tmp/four-pathways.sha256

      - name: Verify production source
        run: npm run verify:launch

      - name: Build production source
        run: npm run build

      - name: Verify Cloudflare Pages configuration
        run: |
          grep -q '"name": "homeleadconnect-web"' wrangler.jsonc
          grep -q '"pages_build_output_dir": "./dist"' wrangler.jsonc
          grep -qxF '/* /index.html 200' public/_redirects

      - name: Capture exact production entry assets
        shell: bash
        run: |
          set -euo pipefail
          entry_js="$(grep -oE 'src="/assets/[^"]+\.js"' dist/index.html | head -n 1 | sed -E 's/^src="|"$//g')"
          entry_css="$(grep -oE 'href="/assets/[^"]+\.css"' dist/index.html | head -n 1 | sed -E 's/^href="|"$//g')"
          test -n "$entry_js"
          test -n "$entry_css"
          echo "ENTRY_JS=$entry_js" >> "$GITHUB_ENV"
          echo "ENTRY_CSS=$entry_css" >> "$GITHUB_ENV"
          echo "Expected entry JS:  $entry_js"
          echo "Expected entry CSS: $entry_css"

      - name: Locate built Four Pathways CSS chunk
        shell: bash
        run: |
          set -euo pipefail
          markers=(
            '/four-pathways-residents-hq-20260915.jpg'
            '/four-pathways-professionals-hq-20260915.jpg'
            '/four-pathways-partners-hq-20260915.jpg'
            '/four-pathways-community-hq-20260915.jpg'
          )

          matches=()
          while IFS= read -r css_file; do
            all_present=yes
            for marker in "${markers[@]}"; do
              if ! grep -Fq "$marker" "$css_file"; then
                all_present=no
                break
              fi
            done
            if [ "$all_present" = yes ]; then
              matches+=("$css_file")
            fi
          done < <(find dist/assets -maxdepth 1 -type f -name '*.css' -print | sort)

          if [ "${#matches[@]}" -ne 1 ]; then
            echo "Expected exactly one built CSS chunk containing all Four Pathways markers; found ${#matches[@]}."
            printf '%s\n' "${matches[@]:-}"
            exit 1
          fi

          css_file="${matches[0]}"
          css_asset="/${css_file#dist/}"
          css_sha="$(sha256sum "$css_file" | awk '{print $1}')"
          echo "FOUR_PATHWAYS_CSS=$css_asset" >> "$GITHUB_ENV"
          echo "FOUR_PATHWAYS_CSS_SHA=$css_sha" >> "$GITHUB_ENV"
          echo "Four Pathways CSS chunk: $css_asset"
          echo "Four Pathways CSS SHA-256: $css_sha"

      - name: Wait for exact Pages build on public hosts
        shell: bash
        run: |
          set -euo pipefail

          hosts=(
            "https://homeleadconnect.org/"
            "https://homeleadconnect-web.pages.dev/"
          )

          for host in "${hosts[@]}"; do
            matched=""
            for attempt in $(seq 1 30); do
              cache_buster="hlc_verify=${GITHUB_SHA}-${attempt}"
              html="$(curl --fail --silent --show-error --location \
                --retry 3 --retry-all-errors --retry-delay 2 \
                --connect-timeout 15 --max-time 45 \
                -H 'Cache-Control: no-cache' \
                "${host}?${cache_buster}")"

              if grep -Fq "$ENTRY_JS" <<<"$html" && grep -Fq "$ENTRY_CSS" <<<"$html"; then
                echo "$host serves exact built entry assets: $ENTRY_JS and $ENTRY_CSS"
                matched="yes"
                break
              fi

              echo "Attempt $attempt: $host has not published exact entry assets yet."
              sleep 10
            done

            if [ -z "$matched" ]; then
              echo "$host did not publish the exact build produced from $GITHUB_SHA."
              exit 1
            fi
          done

      - name: Verify exact deployed Four Pathways CSS chunk
        shell: bash
        run: |
          set -euo pipefail
          markers=(
            '/four-pathways-residents-hq-20260915.jpg'
            '/four-pathways-professionals-hq-20260915.jpg'
            '/four-pathways-partners-hq-20260915.jpg'
            '/four-pathways-community-hq-20260915.jpg'
          )

          for host in \
            https://homeleadconnect.org \
            https://homeleadconnect-web.pages.dev; do
            asset_url="${host}${FOUR_PATHWAYS_CSS}?hlc_verify=${GITHUB_SHA}"
            echo "Checking exact Four Pathways CSS chunk at $asset_url"
            
            css_asset="$(mktemp)"
            headers_file="$(mktemp)"
            http_status=""
            final_url=""
            content_type=""
            content_encoding=""
            content_length=""
            downloaded_bytes=""
            actual_sha=""
            first_bytes=""
            
            # Capture full response details
            http_status=$(curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 45 \
              -H 'Cache-Control: no-cache' \
              -w '%{http_code}' \
              -D "$headers_file" \
              -o "$css_asset" \
              "$asset_url" || echo "CURL_FAILED")
            
            if [ "$http_status" = "CURL_FAILED" ]; then
              echo "ERROR: curl command failed for $host"
              cat "$headers_file" 2>/dev/null || echo "(no headers captured)"
              exit 1
            fi
            
            final_url=$(grep -i '^< HTTP' "$headers_file" | tail -1 || echo "unknown")
            content_type=$(grep -i '^content-type:' "$headers_file" | tail -1 | sed 's/^[^:]*: *//;s/\r$//' || echo "not-set")
            content_encoding=$(grep -i '^content-encoding:' "$headers_file" | tail -1 | sed 's/^[^:]*: *//;s/\r$//' || echo "none")
            content_length=$(grep -i '^content-length:' "$headers_file" | tail -1 | sed 's/^[^:]*: *//;s/\r$//' || echo "not-set")
            downloaded_bytes=$(wc -c < "$css_asset")
            actual_sha=$(sha256sum "$css_asset" | awk '{print $1}')
            first_bytes=$(head -c 100 "$css_asset" | head -c 50)
            
            echo "=== Diagnostic Details for $host ==="
            echo "HTTP Status: $http_status"
            echo "Final URL: $final_url"
            echo "Content-Type: $content_type"
            echo "Content-Encoding: $content_encoding"
            echo "Content-Length header: $content_length"
            echo "Downloaded byte count: $downloaded_bytes"
            echo "Actual SHA-256: $actual_sha"
            echo "Expected SHA-256: $FOUR_PATHWAYS_CSS_SHA"
            echo "First 50 bytes: $first_bytes"
            echo "=================================="
            
            # Verify HTTP status
            if [ "$http_status" != "200" ]; then
              echo "ERROR: HTTP $http_status (expected 200) from $host"
              exit 1
            fi
            
            # Check for HTML fallback (SPA fallback or error page)
            if grep -q '^<html' "$css_asset" || grep -q '^<!DOCTYPE' "$css_asset"; then
              echo "ERROR: Received HTML response instead of CSS from $host"
              head -20 "$css_asset"
              exit 1
            fi
            
            # Verify SHA-256 match
            if [ "$actual_sha" != "$FOUR_PATHWAYS_CSS_SHA" ]; then
              echo "ERROR: SHA-256 mismatch for $host"
              echo "Expected: $FOUR_PATHWAYS_CSS_SHA"
              echo "Got:      $actual_sha"
              exit 1
            fi
            
            # Verify all markers present
            for marker in "${markers[@]}"; do
              if ! grep -Fq "$marker" "$css_asset"; then
                echo "ERROR: Marker '$marker' not found in deployed CSS from $host"
                exit 1
              fi
            done
            
            rm -f "$css_asset" "$headers_file"
            echo "$host serves exact Four Pathways CSS chunk: $FOUR_PATHWAYS_CSS ($actual_sha)"
          done

      - name: Verify deployed Four Pathways image hashes
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            'four-pathways-residents-hq-20260915.jpg|b561b5f1ec9205f98f6d64823a18ffc8336f9720da54c1d9f9aa37a2515d4af0'
            'four-pathways-professionals-hq-20260915.jpg|3b64008bf190d0aa9709602a1fed4168d6d9d5eca0edcbe4f5fddc6a9c7ef58f'
            'four-pathways-partners-hq-20260915.jpg|b2d36b2f1ba59690093a9b07db9996ad0062f83dde4c97eede1e5c7bd9bbc958'
            'four-pathways-community-hq-20260915.jpg|b0f867f47795b1cd1f94b0923befc8fb98aef8bca418a6e6c4152347d8550091'
          )

          for host in \
            https://homeleadconnect.org \
            https://homeleadconnect-web.pages.dev; do
            for item in "${assets[@]}"; do
              filename="${item%%|*}"
              expected="${item##*|}"
              tmp="$(mktemp)"
              curl --fail --silent --show-error --location \
                --retry 3 --retry-all-errors --retry-delay 2 \
                --connect-timeout 15 --max-time 45 \
                -H 'Cache-Control: no-cache' \
                -o "$tmp" \
                "${host}/${filename}?hlc_verify=${GITHUB_SHA}"
              actual="$(sha256sum "$tmp" | awk '{print $1}')"
              rm -f "$tmp"
              test "$actual" = "$expected"
              echo "$host/$filename hash verified: $actual"
            done
          done

      - name: Verify Cloudflare production surfaces
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://app.homeleadconnect.org/ \
            https://app.homeleadconnect.org/login \
            https://app.homeleadconnect.org/dashboard \
            https://app.homeleadconnect.org/messages \
            https://app.homeleadconnect.org/jobs \
            https://app.homeleadconnect.org/calendar \
            https://app.homeleadconnect.org/community-hub \
            https://app.homeleadconnect.org/documents \
            https://app.homeleadconnect.org/hq \
            https://homeleadconnect.org/ \
            https://homeleadconnect-web.pages.dev/; do
            echo "Checking $url"
            curl --fail --silent --show-error --location \
              --retry 6 --retry-all-errors --retry-delay 5 \
              --connect-timeout 15 --max-time 45 \
              -o /tmp/hlc-response.html \
              -w '%{http_code}\n' \
              "$url" | grep -Eq '^2[0-9][0-9]$'
            grep -qi '<html' /tmp/hlc-response.html
          done

      - name: Record production verification target
        run: |
          echo "Verified source SHA: $GITHUB_SHA"
          echo "Verified entry JS: $ENTRY_JS"
          echo "Verified entry CSS: $ENTRY_CSS"
          echo "Verified Four Pathways CSS chunk: $FOUR_PATHWAYS_CSS"
          echo "Verified Four Pathways CSS SHA-256: $FOUR_PATHWAYS_CSS_SHA"
          echo "Verified Four Pathways exact versioned asset hashes"
          echo "Production public host: https://homeleadconnect.org"
          echo "Production app host: https://app.homeleadconnect.org"
          echo "Cloudflare Pages project: homeleadconnect-web"
