name: The HomeLead_Connect Experience — Production Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  verify-production-source:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Verify current Home pathway source assets
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            'page-residents-request-help-20260916.webp'
            'page-professionals-provider-presence-20260916.webp'
            'page-partners-referral-relationships-20260916.webp'
            'page-community-connected-neighbors-20260916.webp'
          )
          for asset in "${assets[@]}"; do
            test -s "public/$asset"
            echo "Current Home pathway source asset present: public/$asset"
          done

      - name: Verify production source
        run: npm run verify:launch

      - name: Verify Cloudflare Pages configuration
        run: |
          grep -q '"name": "homeleadconnect-web"' wrangler.jsonc
          grep -q '"pages_build_output_dir": "./dist"' wrangler.jsonc
          grep -qxF '/* /index.html 200' public/_redirects

      - name: Capture exact production entry assets
        shell: bash
        run: |
          set -euo pipefail
          entry_js="$(grep -oE 'src="/assets/[^"]+\.js"' dist/index.html | head -n 1 | sed -E 's/^src="|"$//g')"
          entry_css="$(grep -oE 'href="/assets/[^"]+\.css"' dist/index.html | head -n 1 | sed -E 's/^href="|"$//g' || true)"
          test -n "$entry_js"
          echo "ENTRY_JS=$entry_js" >> "$GITHUB_ENV"
          echo "ENTRY_CSS=$entry_css" >> "$GITHUB_ENV"
          echo "Expected entry JS:  $entry_js"
          if [ -n "$entry_css" ]; then
            echo "Expected entry CSS: $entry_css"
          else
            echo "No direct entry CSS link found; accepting CSS-code-split build and verifying the authoritative CSS chunk separately."
          fi

      - name: Locate built current Home pathway CSS chunk
        shell: bash
        run: |
          set -euo pipefail
          markers=(
            '/page-residents-request-help-20260916.webp'
            '/page-professionals-provider-presence-20260916.webp'
            '/page-partners-referral-relationships-20260916.webp'
            '/page-community-connected-neighbors-20260916.webp'
          )

          matches=(dist/assets/mockup-authority-20260924-*.css)
          if [ "${#matches[@]}" -ne 1 ] || [ ! -f "${matches[0]}" ]; then
            echo "Expected exactly one built mockup-authority CSS chunk; found ${#matches[@]}."
            printf '%s\n' "${matches[@]:-}"
            exit 1
          fi

          css_file="${matches[0]}"
          for marker in "${markers[@]}"; do
            if ! grep -Fq "$marker" "$css_file"; then
              echo "Current Home pathway marker '$marker' missing from $css_file"
              exit 1
            fi
          done

          css_asset="/${css_file#dist/}"
          css_sha="$(sha256sum "$css_file" | awk '{print $1}')"
          echo "HOME_PATHWAY_CSS=$css_asset" >> "$GITHUB_ENV"
          echo "HOME_PATHWAY_CSS_SHA=$css_sha" >> "$GITHUB_ENV"
          echo "Current Home pathway CSS chunk: $css_asset"
          echo "Current Home pathway CSS SHA-256: $css_sha"

      - name: Wait for Cloudflare Pages deployment check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 90); do
            check_json="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs")"

            cloudflare_status="$(jq -r '[.check_runs[] | select(.name == "Cloudflare Pages")][0].status // "missing"' <<<"$check_json")"
            cloudflare_conclusion="$(jq -r '[.check_runs[] | select(.name == "Cloudflare Pages")][0].conclusion // ""' <<<"$check_json")"

            echo "Cloudflare Pages check attempt $attempt: status=$cloudflare_status conclusion=${cloudflare_conclusion:-pending}"

            if [ "$cloudflare_status" = "completed" ]; then
              if [ "$cloudflare_conclusion" = "success" ]; then
                echo "Cloudflare Pages deployment check succeeded for $GITHUB_SHA."
                break
              fi
              echo "Cloudflare Pages deployment check completed with conclusion: $cloudflare_conclusion"
              exit 1
            fi

            if [ "$attempt" -eq 90 ]; then
              echo "Cloudflare Pages deployment check did not complete within 15 minutes."
              exit 1
            fi

            sleep 10
          done

      - name: Wait for exact Pages build on public hosts
        shell: bash
        run: |
          set -euo pipefail

          hosts=(
            "https://homeleadconnect.org/"
            "https://homeleadconnect-web.pages.dev/"
          )

          for host in "${hosts[@]}"; do
            matched=""
            for attempt in $(seq 1 30); do
              cache_buster="hlc_verify=${GITHUB_SHA}-${attempt}"
              html="$(curl --fail --silent --show-error --location \
                --retry 3 --retry-all-errors --retry-delay 2 \
                --connect-timeout 15 --max-time 45 \
                -H 'Cache-Control: no-cache' \
                "${host}?${cache_buster}")"

              if grep -Fq "$ENTRY_JS" <<<"$html"; then
                if [ -z "${ENTRY_CSS:-}" ] || grep -Fq "$ENTRY_CSS" <<<"$html"; then
                  if [ -n "${ENTRY_CSS:-}" ]; then
                    echo "$host serves exact built entry assets: $ENTRY_JS and $ENTRY_CSS"
                  else
                    echo "$host serves exact built entry JS: $ENTRY_JS; CSS is code-split and verified by exact chunk hash below."
                  fi
                  matched="yes"
                  break
                fi
              fi

              echo "Attempt $attempt: $host has not published exact entry assets yet."
              sleep 10
            done

            if [ -z "$matched" ]; then
              echo "$host did not publish the exact build produced from $GITHUB_SHA."
              exit 1
            fi
          done

      - name: Verify exact deployed current Home pathway CSS chunk
        shell: bash
        run: |
          set -euo pipefail
          markers=(
            '/page-residents-request-help-20260916.webp'
            '/page-professionals-provider-presence-20260916.webp'
            '/page-partners-referral-relationships-20260916.webp'
            '/page-community-connected-neighbors-20260916.webp'
          )

          for host in \
            https://homeleadconnect.org \
            https://homeleadconnect-web.pages.dev; do
            asset_url="${host}${HOME_PATHWAY_CSS}?hlc_verify=${GITHUB_SHA}"
            echo "Checking exact current Home pathway CSS chunk at $asset_url"

            css_asset="$(mktemp)"
            headers_file="$(mktemp)"
            http_status=""
            final_url=""
            content_type=""
            content_encoding=""
            content_length=""
            downloaded_bytes=""
            actual_sha=""
            first_bytes=""

            http_status=$(curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 45 \
              -H 'Cache-Control: no-cache' \
              -w '%{http_code}' \
              -D "$headers_file" \
              -o "$css_asset" \
              "$asset_url" || echo "CURL_FAILED")

            if [ "$http_status" = "CURL_FAILED" ]; then
              echo "ERROR: curl command failed for $host"
              cat "$headers_file" 2>/dev/null || echo "(no headers captured)"
              exit 1
            fi

            final_url=$(grep -i '^< HTTP' "$headers_file" | tail -1 || echo "unknown")
            content_type=$(grep -i '^content-type:' "$headers_file" | tail -1 | sed 's/^[^:]*: *//;s/\r$//' || echo "not-set")
            content_encoding=$(grep -i '^content-encoding:' "$headers_file" | tail -1 | sed 's/^[^:]*: *//;s/\r$//' || echo "none")
            content_length=$(grep -i '^content-length:' "$headers_file" | tail -1 | sed 's/^[^:]*: *//;s/\r$//' || echo "not-set")
            downloaded_bytes=$(wc -c < "$css_asset")
            actual_sha=$(sha256sum "$css_asset" | awk '{print $1}')
            first_bytes=$(head -c 100 "$css_asset" | head -c 50)

            echo "=== Diagnostic Details for $host ==="
            echo "HTTP Status: $http_status"
            echo "Final URL: $final_url"
            echo "Content-Type: $content_type"
            echo "Content-Encoding: $content_encoding"
            echo "Content-Length header: $content_length"
            echo "Downloaded byte count: $downloaded_bytes"
            echo "Actual SHA-256: $actual_sha"
            echo "Expected SHA-256: $HOME_PATHWAY_CSS_SHA"
            echo "First 50 bytes: $first_bytes"
            echo "=================================="

            if [ "$http_status" != "200" ]; then
              echo "ERROR: HTTP $http_status (expected 200) from $host"
              exit 1
            fi

            if grep -q '^<html' "$css_asset" || grep -q '^<!DOCTYPE' "$css_asset"; then
              echo "ERROR: Received HTML response instead of CSS from $host"
              head -20 "$css_asset"
              exit 1
            fi

            if [ "$actual_sha" != "$HOME_PATHWAY_CSS_SHA" ]; then
              echo "ERROR: SHA-256 mismatch for $host"
              echo "Expected: $HOME_PATHWAY_CSS_SHA"
              echo "Got:      $actual_sha"
              exit 1
            fi

            for marker in "${markers[@]}"; do
              if ! grep -Fq "$marker" "$css_asset"; then
                echo "ERROR: Marker '$marker' not found in deployed CSS from $host"
                exit 1
              fi
            done

            rm -f "$css_asset" "$headers_file"
            echo "$host serves exact current Home pathway CSS chunk: $HOME_PATHWAY_CSS ($actual_sha)"
          done

      - name: Verify deployed current Home pathway image hashes
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            'page-residents-request-help-20260916.webp'
            'page-professionals-provider-presence-20260916.webp'
            'page-partners-referral-relationships-20260916.webp'
            'page-community-connected-neighbors-20260916.webp'
          )

          for host in \
            https://homeleadconnect.org \
            https://homeleadconnect-web.pages.dev; do
            for filename in "${assets[@]}"; do
              expected="$(sha256sum "public/$filename" | awk '{print $1}')"
              tmp="$(mktemp)"
              curl --fail --silent --show-error --location \
                --retry 3 --retry-all-errors --retry-delay 2 \
                --connect-timeout 15 --max-time 45 \
                -H 'Cache-Control: no-cache' \
                -o "$tmp" \
                "${host}/${filename}?hlc_verify=${GITHUB_SHA}"
              actual="$(sha256sum "$tmp" | awk '{print $1}')"
              rm -f "$tmp"
              if [ "$actual" != "$expected" ]; then
                echo "ERROR: image hash mismatch for $host/$filename"
                echo "Expected: $expected"
                echo "Got:      $actual"
                exit 1
              fi
              echo "$host/$filename hash verified: $actual"
            done
          done

      - name: Verify Cloudflare production surfaces
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://app.homeleadconnect.org/ \
            https://app.homeleadconnect.org/login \
            https://app.homeleadconnect.org/dashboard \
            https://app.homeleadconnect.org/messages \
            https://app.homeleadconnect.org/jobs \
            https://app.homeleadconnect.org/calendar \
            https://app.homeleadconnect.org/community-hub \
            https://app.homeleadconnect.org/documents \
            https://app.homeleadconnect.org/hq \
            https://homeleadconnect.org/ \
            https://homeleadconnect-web.pages.dev/; do
            echo "Checking $url"
            curl --fail --silent --show-error --location \
              --retry 6 --retry-all-errors --retry-delay 5 \
              --connect-timeout 15 --max-time 45 \
              -o /tmp/hlc-response.html \
              -w '%{http_code}\n' \
              "$url" | grep -Eq '^2[0-9][0-9]$'
            grep -qi '<html' /tmp/hlc-response.html
          done

      - name: Record production verification target
        run: |
          echo "Verified source SHA: $GITHUB_SHA"
          echo "Verified entry JS: $ENTRY_JS"
          if [ -n "${ENTRY_CSS:-}" ]; then
            echo "Verified entry CSS: $ENTRY_CSS"
          else
            echo "Verified entry CSS: none (CSS code-split build)"
          fi
          echo "Verified current Home pathway CSS chunk: $HOME_PATHWAY_CSS"
          echo "Verified current Home pathway CSS SHA-256: $HOME_PATHWAY_CSS_SHA"
          echo "Verified current Home pathway exact deployed asset hashes"
          echo "Production public host: https://homeleadconnect.org"
          echo "Production app host: https://app.homeleadconnect.org"
          echo "Cloudflare Pages project: homeleadconnect-web"