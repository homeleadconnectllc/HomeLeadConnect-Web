name: Reconcile Professional eyes verification contract

on:
  push:
    branches:
      - fix/professional-eyes-promotion-20260916

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/professional-eyes-promotion-20260916
          fetch-depth: 0
      - name: Reconcile exact approved asset contract
        shell: bash
        run: |
          set -euo pipefail
          asset='public/four-pathways-professionals-hq-20260915.jpg'
          expected_hash='4df6446e022a42f720b7ff90da6af8148d17787bf13f5adf2eb71ea8aa82cd46'
          expected_size='94971'
          actual_hash="$(sha256sum "$asset" | awk '{print $1}')"
          actual_size="$(wc -c < "$asset" | tr -d ' ')"
          test "$actual_hash" = "$expected_hash"
          test "$actual_size" = "$expected_size"

          python - <<'PY'
          from pathlib import Path

          old_hash = '1622254895e6e9c598befdda73a6671c304ce016811a4d70db89eb6553a00415'
          new_hash = '4df6446e022a42f720b7ff90da6af8148d17787bf13f5adf2eb71ea8aa82cd46'

          verify = Path('scripts/verify-frontdoor-assets.mjs')
          text = verify.read_text()
          old_block = '''    path: "four-pathways-professionals-hq-20260915.jpg",\n    expectedSize: 43570,\n    expectedSha256: "1622254895e6e9c598befdda73a6671c304ce016811a4d70db89eb6553a00415",'''
          new_block = '''    path: "four-pathways-professionals-hq-20260915.jpg",\n    expectedSize: 94971,\n    expectedSha256: "4df6446e022a42f720b7ff90da6af8148d17787bf13f5adf2eb71ea8aa82cd46",'''
          if text.count(old_block) != 1:
              raise SystemExit('Expected exactly one stale Professionals verifier block')
          verify.write_text(text.replace(old_block, new_block))

          prod = Path('.github/workflows/cloudflare-production-verification.yml')
          prod_text = prod.read_text()
          if prod_text.count(old_hash) != 2:
              raise SystemExit(f'Expected exactly two stale production hash references, found {prod_text.count(old_hash)}')
          prod.write_text(prod_text.replace(old_hash, new_hash))
          PY

          git rm .github/workflows/reconcile-professional-eyes-contract.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-frontdoor-assets.mjs .github/workflows/cloudflare-production-verification.yml
          git commit -am 'Reconcile verification to approved Professional pathway image'
          git push origin HEAD:fix/professional-eyes-promotion-20260916
