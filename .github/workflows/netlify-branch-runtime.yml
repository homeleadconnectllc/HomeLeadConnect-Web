name: HLC Netlify Branch Runtime

on:
  push:
    branches:
      - agent/functional-completion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-runtime:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@v4

      - name: Verify hosted runtime binds to production Supabase in source
        run: |
          set -euo pipefail
          grep -q 'https://cguhtshclyybivvdnpig.supabase.co' src/lib/supabase.ts
          grep -q 'host.endsWith(".netlify.app")' src/lib/supabase.ts
          ! grep -q 'https://agfwqnirspmptjiqrrtk.supabase.co' src/lib/supabase.ts

      - name: Trigger isolated Netlify branch build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN" || { echo 'NETLIFY_AUTH_TOKEN is not configured'; exit 10; }
          SITE_ID="641b807e-cb0e-4132-9075-a057481bee32"
          BRANCH="agent/functional-completion"
          curl -fsS -X POST \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            --get \
            --data-urlencode "branch=$BRANCH" \
            --data-urlencode "clear_cache=true" \
            --data-urlencode "title=HLC functional completion runtime $GITHUB_SHA" \
            "https://api.netlify.com/api/v1/sites/$SITE_ID/builds" \
            > /tmp/netlify-build.json
          jq '{id, deploy_id, sha, done, error, created_at}' /tmp/netlify-build.json

      - name: Wait for exact branch deploy and diagnose public edge routing
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          SITE_ID="641b807e-cb0e-4132-9075-a057481bee32"
          BRANCH="agent/functional-completion"
          for attempt in $(seq 1 90); do
            curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/sites/$SITE_ID/deploys?per_page=50" \
              > /tmp/netlify-deploys.json

            MATCH="$(jq -c --arg branch "$BRANCH" --arg sha "$GITHUB_SHA" '
              .[]
              | select((.branch // "") == $branch and (.commit_ref // "") == $sha and (.context // "") == "branch-deploy")
              | {id,state,branch,context,commit_ref}
            ' /tmp/netlify-deploys.json | head -n 1)"

            if [ -n "$MATCH" ]; then
              STATE="$(printf '%s' "$MATCH" | jq -r '.state')"
              DEPLOY_ID="$(printf '%s' "$MATCH" | jq -r '.id')"
              echo "$MATCH" | jq .
              if [ "$STATE" = "ready" ]; then
                curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
                  "https://api.netlify.com/api/v1/deploys/$DEPLOY_ID" > /tmp/deploy.json
                curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
                  "https://api.netlify.com/api/v1/sites/$SITE_ID" > /tmp/site.json

                echo '--- Netlify deploy object ---'
                jq '{id,site_id,state,name,url,ssl_url,deploy_url,deploy_ssl_url,admin_url,branch,context,commit_ref,published_at,skipped,error_message}' /tmp/deploy.json
                echo '--- Netlify site object ---'
                jq '{id,name,url,ssl_url,admin_url,custom_domain,domain_aliases,deploy_hook,capabilities}' /tmp/site.json

                SITE_NAME="$(jq -r '.name' /tmp/site.json)"
                BRANCH_URL="$(jq -r '.deploy_ssl_url // .deploy_url' /tmp/deploy.json)"
                IMMUTABLE_URL="https://${DEPLOY_ID}--${SITE_NAME}.netlify.app"
                echo "BRANCH_URL=$BRANCH_URL"
                echo "IMMUTABLE_URL=$IMMUTABLE_URL"

                echo '--- DNS ---'
                getent ahosts "${BRANCH_URL#https://}" || true
                getent ahosts "${IMMUTABLE_URL#https://}" || true

                echo '--- IPv4/IPv6 HTTP probes ---'
                for URL in "$BRANCH_URL" "$IMMUTABLE_URL"; do
                  echo "URL=$URL"
                  CODE4="$(curl -4 -sS -L -o /tmp/probe4.html -w '%{http_code}' "$URL" || true)"
                  echo "ipv4_status=$CODE4 marker=$(grep -qi 'HomeLead Connect' /tmp/probe4.html && echo yes || echo no)"
                  CODE6="$(curl -6 -sS -L -o /tmp/probe6.html -w '%{http_code}' "$URL" || true)"
                  echo "ipv6_status=$CODE6 marker=$(grep -qi 'HomeLead Connect' /tmp/probe6.html && echo yes || echo no)"
                done

                curl -4 -fsSL "$IMMUTABLE_URL" -o /tmp/hlc-runtime.html
                grep -qi 'HomeLead Connect' /tmp/hlc-runtime.html || exit 21
                echo "NETLIFY_RUNTIME_URL=$IMMUTABLE_URL" | tee -a "$GITHUB_ENV"
                exit 0
              fi
              if [ "$STATE" = "error" ]; then
                echo 'Netlify branch deploy failed.'
                exit 20
              fi
            fi
            sleep 5
          done
          echo 'Timed out waiting for exact-SHA branch deploy.'
          exit 22

      - name: Runtime summary
        run: |
          echo "Branch runtime verified for $GITHUB_SHA"
          echo "$NETLIFY_RUNTIME_URL"
