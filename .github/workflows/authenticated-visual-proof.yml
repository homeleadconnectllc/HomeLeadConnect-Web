name: HLC Authenticated Visual Proof

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: https://cguhtshclyybivvdnpig.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_MQioEyUGv8MNlowJgVyXYQ_kf5cyafA
      HLC_VISUAL_TEST_EMAIL: ${{ secrets.HLC_VISUAL_TEST_EMAIL }}
      HLC_VISUAL_TEST_PASSWORD: ${{ secrets.HLC_VISUAL_TEST_PASSWORD }}

    steps:
      - name: Checkout test-only probe
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Verify controlled test credentials exist
        run: |
          set -euo pipefail
          test -n "${HLC_VISUAL_TEST_EMAIL:-}" || exit 61
          test -n "${HLC_VISUAL_TEST_PASSWORD:-}" || exit 62

      - name: Exercise full Professional lifecycle against production
        run: node scripts/professional-production-e2e.mjs
