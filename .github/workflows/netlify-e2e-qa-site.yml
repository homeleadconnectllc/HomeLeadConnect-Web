name: HLC Netlify E2E QA Site

on:
  push:
    branches:
      - agent/functional-completion
      - launch/global-readiness-2026-08-16
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-qa:
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_SUPABASE_URL: https://agfwqnirspmptjiqrrtk.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_oe-fZIb14XWNWgk5-0pPfw_Xqb0dqYv
      VITE_AUTH_CAPTCHA_REQUIRED: "false"
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify isolated QA runtime configuration
        run: |
          set -euo pipefail
          test -n "$VITE_SUPABASE_URL" || { echo 'VITE_SUPABASE_URL is unavailable'; exit 11; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo 'VITE_SUPABASE_ANON_KEY is unavailable'; exit 12; }
          test "$VITE_SUPABASE_URL" = "https://agfwqnirspmptjiqrrtk.supabase.co" || { echo 'QA must not use the production Supabase project'; exit 13; }
          test "$VITE_AUTH_CAPTCHA_REQUIRED" = "false" || { echo 'QA CAPTCHA isolation flag is incorrect'; exit 14; }
          echo 'Isolated QA runtime configuration is present.'

      - name: Verify launch candidate
        run: npm run verify:launch

      - name: Build exact SHA
        run: npm run build

      - name: Create or reuse isolated Netlify QA site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN" || { echo 'NETLIFY_AUTH_TOKEN is not configured'; exit 10; }
          QA_NAME="hlc-functional-e2e-641b807e"
          curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites?per_page=100" > /tmp/sites.json
          QA_SITE_ID="$(jq -r --arg n "$QA_NAME" '.[] | select(.name == $n) | .id' /tmp/sites.json | head -n 1)"
          if [ -z "$QA_SITE_ID" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$QA_NAME\"}" \
              "https://api.netlify.com/api/v1/sites" > /tmp/qa-site.json
            QA_SITE_ID="$(jq -r '.id' /tmp/qa-site.json)"
          fi
          test -n "$QA_SITE_ID" && test "$QA_SITE_ID" != "null"
          echo "QA_SITE_ID=$QA_SITE_ID" >> "$GITHUB_ENV"
          echo "QA_NAME=$QA_NAME" >> "$GITHUB_ENV"
          echo "Isolated QA site ready: $QA_NAME ($QA_SITE_ID)"

      - name: Deploy exact SHA to isolated QA site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          zip -qr /tmp/hlc-qa.zip .
          cd ..
          curl -fsS -X POST \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @/tmp/hlc-qa.zip \
            "https://api.netlify.com/api/v1/sites/$QA_SITE_ID/deploys" \
            > /tmp/qa-deploy.json
          jq '{id,state,url,ssl_url,deploy_url,deploy_ssl_url,site_id,created_at,published_at}' /tmp/qa-deploy.json
          QA_DEPLOY_ID="$(jq -r '.id' /tmp/qa-deploy.json)"
          test -n "$QA_DEPLOY_ID" && test "$QA_DEPLOY_ID" != "null"
          echo "QA_DEPLOY_ID=$QA_DEPLOY_ID" >> "$GITHUB_ENV"

      - name: Verify QA runtime publicly
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          EXPECTED="https://${QA_NAME}.netlify.app"
          echo "expected=$EXPECTED"
          for attempt in $(seq 1 36); do
            curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/deploys/$QA_DEPLOY_ID" > /tmp/qa-deploy-state.json
            STATE="$(jq -r '.state' /tmp/qa-deploy-state.json)"
            CODE="$(curl --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors -sS -L -o /tmp/qa.html -w '%{http_code}' "$EXPECTED" || true)"
            echo "Attempt $attempt: deploy=$STATE http=$CODE"
            if [ "$STATE" = "ready" ] && [ "$CODE" = "200" ] && grep -qi 'HomeLead Connect' /tmp/qa.html; then
              echo "Verified public QA runtime: $EXPECTED"
              echo "HLC_E2E_QA_URL=$EXPECTED" >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "$STATE" = "error" ]; then
              jq '{id,state,error_message}' /tmp/qa-deploy-state.json
              exit 31
            fi
            sleep 5
          done
          echo 'QA runtime did not become publicly usable.'
          exit 30

      - name: Verify every static HLC route is delivered by QA
        run: |
          set -euo pipefail
          BASE="$HLC_E2E_QA_URL"
          ROUTES="$(grep -o 'path="[^"]*"' src/routes/AppRouter.tsx \
            | sed -E 's/^path="(.*)"$/\1/' \
            | grep -v ':' \
            | grep -v '^\*$' \
            | sort -u)"
          test -n "$ROUTES"
          failures=0
          checked=0
          while IFS= read -r route; do
            [ -n "$route" ] || continue
            checked=$((checked + 1))
            body="/tmp/qa-route-${checked}.html"
            code="$(curl --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors -sS -L -o "$body" -w '%{http_code}' "${BASE}${route}" || true)"
            if [ "$code" != "200" ] || ! grep -qi 'HomeLead Connect' "$body"; then
              echo "FAIL route=$route http=$code"
              failures=$((failures + 1))
            else
              echo "PASS route=$route http=$code"
            fi
          done <<< "$ROUTES"
          echo "Static route delivery checked: $checked"
          test "$checked" -ge 40
          test "$failures" -eq 0

      - name: Run rendered mobile Lighthouse gate
        run: |
          set -euo pipefail
          npx --yes lighthouse@13.4.1 "$HLC_E2E_QA_URL/" \
            --quiet \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,best-practices \
            --output=json \
            --output-path=/tmp/lighthouse-mobile.json
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/lighthouse-mobile.json', 'utf8'));
          const score = (key) => Number(report.categories[key]?.score ?? 0);
          const scores = {
            performance: score('performance'),
            accessibility: score('accessibility'),
            bestPractices: score('best-practices'),
          };
          console.log('Mobile Lighthouse', scores);
          if (scores.performance < 0.70) throw new Error(`Mobile performance ${scores.performance} < 0.70`);
          if (scores.accessibility < 0.95) throw new Error(`Mobile accessibility ${scores.accessibility} < 0.95`);
          if (scores.bestPractices < 0.90) throw new Error(`Mobile best practices ${scores.bestPractices} < 0.90`);
          NODE

      - name: Run rendered desktop Lighthouse gate
        run: |
          set -euo pipefail
          npx --yes lighthouse@13.4.1 "$HLC_E2E_QA_URL/" \
            --quiet \
            --preset=desktop \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,best-practices \
            --output=json \
            --output-path=/tmp/lighthouse-desktop.json
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/lighthouse-desktop.json', 'utf8'));
          const score = (key) => Number(report.categories[key]?.score ?? 0);
          const scores = {
            performance: score('performance'),
            accessibility: score('accessibility'),
            bestPractices: score('best-practices'),
          };
          console.log('Desktop Lighthouse', scores);
          if (scores.performance < 0.80) throw new Error(`Desktop performance ${scores.performance} < 0.80`);
          if (scores.accessibility < 0.95) throw new Error(`Desktop accessibility ${scores.accessibility} < 0.95`);
          if (scores.bestPractices < 0.90) throw new Error(`Desktop best practices ${scores.bestPractices} < 0.90`);
          NODE

      - name: Upload rendered QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-qa-${{ github.sha }}
          path: |
            /tmp/lighthouse-mobile.json
            /tmp/lighthouse-desktop.json
          if-no-files-found: warn
          retention-days: 14

      - name: Runtime summary
        run: |
          echo "Exact SHA: $GITHUB_SHA"
          echo "QA URL: $HLC_E2E_QA_URL"
