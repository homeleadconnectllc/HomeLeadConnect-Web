name: HLC Logo Reference Sweep

on:
  push:
    branches:
      - postlaunch/global-transparent-logo-fix-20260826
    paths:
      - .github/workflows/hlc-logo-reference-sweep.yml
      - public/hlc-logo-transparent.png
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-logo-references:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace active opaque logo references
        shell: python
        run: |
          from pathlib import Path

          roots = [Path("src"), Path("public")]
          files = [Path("index.html")]
          allowed = {".html", ".tsx", ".ts", ".jsx", ".js", ".css", ".json", ".webmanifest"}
          for root in roots:
              if not root.exists():
                  continue
              files.extend(p for p in root.rglob("*") if p.is_file() and p.suffix.lower() in allowed)

          replacements = {
              "/hlc-icon.jpeg": "/hlc-logo-transparent.png",
              "/hlc-trans-logo.jpeg": "/hlc-logo-transparent.png",
              "/logo.png": "/hlc-logo-transparent.png",
              "/hlc-logo-final.png": "/hlc-logo-transparent.png",
          }

          changed = []
          for path in sorted(set(files)):
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if path.name == "manifest.webmanifest":
                  updated = updated.replace('"type": "image/jpeg"', '"type": "image/png"')
              if path == Path("index.html"):
                  updated = updated.replace('type="image/jpeg" href="/hlc-logo-transparent.png"', 'type="image/png" href="/hlc-logo-transparent.png"')
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print("Changed active logo references:")
          for path in changed:
              print(f"- {path}")

          # Hard gate: active UI/metadata source must not retain opaque legacy identity references.
          forbidden = ("/hlc-icon.jpeg", "/hlc-trans-logo.jpeg", 'src="/logo.png"', "href=\"/logo.png\"")
          failures = []
          for path in sorted(set(files)):
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for token in forbidden:
                  if token in text:
                      failures.append(f"{path}: {token}")
          if failures:
              raise SystemExit("Legacy opaque logo references remain:\n" + "\n".join(failures))

      - name: Verify transparent asset and metadata
        shell: python
        run: |
          import struct
          from pathlib import Path

          logo = Path("public/hlc-logo-transparent.png").read_bytes()
          if not logo.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("Transparent logo is not a PNG")
          width, height, depth, color_type, *_ = struct.unpack(">IIBBBBB", logo[16:29])
          if width != 1024 or height != 1024 or depth != 8 or color_type != 6:
              raise SystemExit(f"Unexpected transparent logo format {width}x{height}, depth={depth}, color={color_type}")

          index = Path("index.html").read_text()
          manifest = Path("public/manifest.webmanifest").read_text()
          if "/hlc-logo-transparent.png" not in index:
              raise SystemExit("index.html does not reference transparent logo")
          if '"src": "/hlc-logo-transparent.png"' not in manifest or '"type": "image/png"' not in manifest:
              raise SystemExit("PWA manifest is not normalized to transparent PNG")
          print("Transparent logo is 1024x1024 RGBA and active browser/PWA metadata uses it.")

      - name: Commit normalized references
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Logo references already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html public src
          git commit -m "brand: use transparent HLC logo globally"
          git push
