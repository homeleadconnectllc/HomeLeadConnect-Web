name: Temporary Professional Progress Plan Registration

on:
  push:
    branches:
      - fix/professional-progress-activity-uuid-20260909

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/professional-progress-activity-uuid-20260909
          fetch-depth: 1
      - name: Register migration and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/RELEASE_MIGRATION_PLAN.md')
          text = path.read_text()
          item = '125. `20260909205000_fix_contractor_progress_activity_entity_uuid.sql`'
          if item not in text:
              anchor = '124. `20260908171000_signup_trial_entitlement_root_fix.sql`'
              if anchor not in text:
                  raise SystemExit('release plan anchor not found')
              text = text.replace(anchor, anchor + '\n' + item, 1)
              path.write_text(text)
          Path('.github/workflows/tmp-professional-progress-plan.yml').unlink()
          PY
          git config user.name 'homeleadconnectllc'
          git config user.email '285241474+homeleadconnectllc@users.noreply.github.com'
          git add supabase/RELEASE_MIGRATION_PLAN.md .github/workflows/tmp-professional-progress-plan.yml
          git commit -m 'Register Professional progress activity repair migration'
          git push origin HEAD:fix/professional-progress-activity-uuid-20260909
