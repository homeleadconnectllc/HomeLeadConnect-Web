name: HLC Brand Asset Bootstrap

on:
  push:
    branches:
      - sprint/master-logo-rollout-20260914

permissions:
  contents: write

jobs:
  finalize-brand-references:
    if: "!contains(github.event.head_commit.message, '[brand-asset-bootstrap]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/master-logo-rollout-20260914
          fetch-depth: 0

      - name: Repair logo runtime and branding contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path("src/main.tsx")
          text = main.read_text()
          updated = text.replace("/hlc-logo-public.webp", "/brand/homelead-connect-master-transparent.png")
          if updated == text:
              raise SystemExit("Expected active public logo reference not found in src/main.tsx")
          main.write_text(updated)

          perf = Path("src/routes/publicHomePerformanceContract.test.ts")
          text = perf.read_text()
          old = r'/hlc-logo-public\\.webp'
          new = r'/brand\\/homelead-connect-master-transparent\\.png'
          updated = text.replace(old, new)
          if updated == text:
              raise SystemExit("Expected legacy logo contract not found in publicHomePerformanceContract.test.ts")
          perf.write_text(updated)

          brand = Path("src/routes/brandSystem.test.ts")
          text = brand.read_text()
          start = text.index("function pngAlphaAt")
          end = text.index('test("HLC canonical brand lock')
          decoder = r'''function pngAlphaAt(buffer: Buffer, x: number, y: number) {
  const width = buffer.readUInt32BE(16);
  const height = buffer.readUInt32BE(20);
  assert.ok(x >= 0 && x < width && y >= 0 && y < height);

  let offset = 8;
  const idat: Buffer[] = [];
  while (offset < buffer.length) {
    const length = buffer.readUInt32BE(offset);
    const kind = buffer.toString("ascii", offset + 4, offset + 8);
    if (kind === "IDAT") idat.push(buffer.subarray(offset + 8, offset + 8 + length));
    offset += 12 + length;
    if (kind === "IEND") break;
  }

  const raw = inflateSync(Buffer.concat(idat));
  const bytesPerPixel = 4;
  const rowBytes = width * bytesPerPixel;
  const decoded = Buffer.alloc(rowBytes * height);
  const paeth = (a: number, b: number, c: number) => {
    const p = a + b - c;
    const pa = Math.abs(p - a);
    const pb = Math.abs(p - b);
    const pc = Math.abs(p - c);
    return pa <= pb && pa <= pc ? a : pb <= pc ? b : c;
  };

  let source = 0;
  for (let row = 0; row < height; row += 1) {
    const filter = raw[source++];
    const rowStart = row * rowBytes;
    const priorStart = rowStart - rowBytes;
    for (let i = 0; i < rowBytes; i += 1) {
      const value = raw[source++];
      const left = i >= bytesPerPixel ? decoded[rowStart + i - bytesPerPixel] : 0;
      const up = row > 0 ? decoded[priorStart + i] : 0;
      const upLeft = row > 0 && i >= bytesPerPixel ? decoded[priorStart + i - bytesPerPixel] : 0;
      if (filter === 0) decoded[rowStart + i] = value;
      else if (filter === 1) decoded[rowStart + i] = (value + left) & 255;
      else if (filter === 2) decoded[rowStart + i] = (value + up) & 255;
      else if (filter === 3) decoded[rowStart + i] = (value + Math.floor((left + up) / 2)) & 255;
      else if (filter === 4) decoded[rowStart + i] = (value + paeth(left, up, upLeft)) & 255;
      else assert.fail(`unsupported PNG filter type ${filter}`);
    }
  }

  return decoded[y * rowBytes + x * bytesPerPixel + 3];
}

'''
          brand.write_text(text[:start] + decoder + text[end:])
          PY

      - name: Commit branding-only contract repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx src/routes/publicHomePerformanceContract.test.ts src/routes/brandSystem.test.ts
          git diff --cached --stat
          git diff --cached --name-only
          git commit -m "Brand: repair logo runtime contracts [brand-asset-bootstrap]"
          git push origin HEAD:sprint/master-logo-rollout-20260914
