name: HLC Brand Asset Bootstrap

on:
  push:
    branches:
      - sprint/master-logo-rollout-20260914

permissions:
  contents: write

jobs:
  finalize-brand-references:
    if: "!contains(github.event.head_commit.message, '[brand-asset-bootstrap]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/master-logo-rollout-20260914
          fetch-depth: 0

      - name: Repoint remaining public runtime and contract references
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path("src/main.tsx")
          text = main.read_text()
          updated = text.replace("/hlc-logo-public.webp", "/brand/homelead-connect-master-transparent.png")
          if updated == text:
              raise SystemExit("Expected active public logo reference not found in src/main.tsx")
          main.write_text(updated)

          test = Path("src/routes/publicHomePerformanceContract.test.ts")
          text = test.read_text()
          old = r'/hlc-logo-public\\.webp'
          new = r'/brand\\/homelead-connect-master-transparent\\.png'
          updated = text.replace(old, new)
          if updated == text:
              raise SystemExit("Expected legacy logo contract not found in publicHomePerformanceContract.test.ts")
          test.write_text(updated)
          PY

      - name: Commit branding-only contract alignment
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx src/routes/publicHomePerformanceContract.test.ts
          git diff --cached --stat
          git diff --cached --name-only
          git commit -m "Brand: align remaining runtime logo references [brand-asset-bootstrap]"
          git push origin HEAD:sprint/master-logo-rollout-20260914
